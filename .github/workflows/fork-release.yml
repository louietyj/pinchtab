name: Fork / Edge release

# Every push to main publishes an edge release, marked latest: the web-browser
# skill installs releases/latest, so a push reaches the next sandbox. Each push
# gets its own release, so a download never meets a half-uploaded one, and
# rolling back is marking an older one latest. See FORK.md.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Name it
        run: echo "TAG=edge-$GITHUB_RUN_NUMBER-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          for asset in pinchtab-linux-amd64 pinchtab-linux-arm64 pinchtab-darwin-arm64 pinchtab-windows-amd64.exe; do
            platform=${asset#pinchtab-}; platform=${platform%.exe}
            CGO_ENABLED=0 GOOS=${platform%-*} GOARCH=${platform#*-} \
              go build -ldflags "-s -w -X main.version=$TAG" -o "$asset" ./cmd/pinchtab
          done
          # The web-browser skill prints this release's own SKILL.md and references,
          # not the npm package's upstream copy.
          tar czf pinchtab-skill.tar.gz -C skills pinchtab

      - name: Publish
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          { echo "Since $prev:"; echo; git log --no-merges --format='- %s (%h)' "$prev..$GITHUB_SHA"; } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --latest \
            --title "$TAG" --notes-file notes.md \
            pinchtab-linux-amd64 pinchtab-linux-arm64 pinchtab-darwin-arm64 pinchtab-windows-amd64.exe \
            pinchtab-skill.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prune old edge releases
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name | startswith("edge-")) | .tag_name' \
            | tail -n +21 | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
        env:
          GH_TOKEN: ${{ github.token }}
